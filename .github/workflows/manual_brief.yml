# manual_brief.yml — triggered by the Cloudflare Worker when a user sends /brief or /preview.
# Generates and sends a brief for ONE specific user (identified by telegram_id input).

name: Manual Cyber Intel Brief (Single User)

on:
  workflow_dispatch:
    inputs:
      telegram_id:
        description: "Numeric Telegram user ID (e.g. 254816375) — NOT a @username. Use the /users admin command in the bot to look up IDs."
        required: true
        type: string
      format:
        description: "Format override: full, tldr, or links (omit to use user's stored format)"
        required: false
        type: string
        default: ""
      force_refresh:
        description: "Set to 'true' to bypass brief and article caches (used by /preview)"
        required: false
        type: string
        default: ""

jobs:
  send-brief:
    name: Generate and Send Brief for User ${{ inputs.telegram_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run brief generator (single user)
        run: |
          ARGS="--user ${{ inputs.telegram_id }}"
          if [ -n "${{ inputs.format }}" ]; then
            ARGS="$ARGS --format ${{ inputs.format }}"
          fi
          if [ "${{ inputs.force_refresh }}" = "true" ]; then
            ARGS="$ARGS --force-refresh"
          fi
          python bot/brief_generator.py $ARGS
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
