# manual_brief.yml — triggered by the Cloudflare Worker when a user sends /brief or /preview.
# Generates and sends a brief for ONE specific user (identified by telegram_id input).

name: Manual Cyber Intel Brief (Single User)

on:
  workflow_dispatch:
    inputs:
      telegram_id:
        description: "Telegram user ID to send the brief to"
        required: true
        type: string

jobs:
  send-brief:
    name: Generate and Send Brief for User ${{ inputs.telegram_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run brief generator (single user)
        # Pass --user so brief_generator.py targets only this Telegram ID
        run: python bot/brief_generator.py --user ${{ inputs.telegram_id }}
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          NEWSAPI_KEY:          ${{ secrets.NEWSAPI_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
